[package]
name = "kestrel-helper"
version = "0.1.0"
edition = "2021"
description = "Kestrel Remote Windows helper: monitor enumeration, screen capture, input injection and clipboard behind a strict stdio protocol."
license = "UNLICENSED"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
