# Public landing page and Windows installer download.
#
#   https://<domain>/                                -> site/index.html
#   https://<domain>/site/{styles.css,favicon.svg,og.png}
#   https://<domain>/downloads/pbs-anydesk-setup.exe -> the installer
#
# Everything else keeps falling through to the site's `location / { return 404; }`:
# `location = /` is an exact match and the two `^~` prefixes are longer than `/`,
# so the existing 404 block, /api/v1/, /health and /ws stay untouched.
#
# Files live outside every web root and outside the repository checkout:
#   install -D -m 644 site/index.html  /usr/share/nginx/kestrel/site/index.html
#   install -D -m 644 site/styles.css  /usr/share/nginx/kestrel/site/styles.css
#   install -D -m 644 site/favicon.svg /usr/share/nginx/kestrel/site/favicon.svg
#   install -D -m 644 site/og.png      /usr/share/nginx/kestrel/site/og.png
#   install -D -m 644 <installer>.exe  /usr/share/nginx/kestrel/downloads/pbs-anydesk-setup.exe
#   install -D -m 644 nginx/site.conf  /etc/nginx/snippets/kestrel-site.conf
#
# Included inside the HTTPS server block of the Kestrel site (see
# kestrel.conf.template). Each location sets its own add_header lines, which
# replace the server's, so HSTS is repeated here.

location = / {
    root /usr/share/nginx/kestrel/site;
    try_files /index.html =404;
    default_type text/html;
    charset utf-8;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
}

location ^~ /site/ {
    root /usr/share/nginx/kestrel;
    # Only the page's assets; index.html is served at / only.
    location ~ ^/site/(styles\.css|favicon\.svg|og\.png)$ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;
    }
    return 404;
}

location ^~ /downloads/ {
    root /usr/share/nginx/kestrel;
    location = /downloads/pbs-anydesk-setup.exe {
        types { }
        default_type application/vnd.microsoft.portable-executable;
        add_header Content-Disposition 'attachment; filename="pbs-anydesk-setup.exe"' always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
    }
    return 404;
}
