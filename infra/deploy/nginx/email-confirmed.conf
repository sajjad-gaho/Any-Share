# Landing page for links in Supabase Auth e-mails (set Auth -> URL Configuration
# -> Site URL to https://<domain>/email-confirmed). Supabase confirms the account
# before redirecting here; this page only tells the person to go back to the app.
#
# Static and script-free. The tokens Supabase appends after `#` stay in the
# browser: URL fragments are never sent to the server.
#
# Install (the page lives outside every web root, so nothing else serves it):
#   install -D -m 644 email-confirmed.html /usr/share/nginx/kestrel/email-confirmed.html
#   install -D -m 644 email-confirmed.conf /etc/nginx/snippets/kestrel-email-confirmed.conf
#
# Included inside the HTTPS server block of the Kestrel site (see
# kestrel.conf.template). Its own add_header lines replace the server's, so HSTS
# is repeated here.
location = /email-confirmed {
    alias /usr/share/nginx/kestrel/email-confirmed.html;
    default_type text/html;
    charset utf-8;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;
}
