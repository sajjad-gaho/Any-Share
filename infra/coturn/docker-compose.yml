# Local coturn for development: `docker compose up` in infra/coturn.
# Requires infra/coturn/.env with TURN_SECRET (copy .env.example).
services:
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET:?Set TURN_SECRET in infra/coturn/.env}
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
    volumes:
      - ./turnserver.dev.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - '3478:3478/udp'
      - '3478:3478/tcp'
      - '49160-49200:49160-49200/udp'
