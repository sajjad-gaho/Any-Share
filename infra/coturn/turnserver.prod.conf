# coturn — PRODUCTION TEMPLATE. Review every value before deploying.
#
# Secrets (static-auth-secret) and certificate paths are provided by the
# deployment environment, never committed. Run coturn on its own host (or
# with host networking) with a public IP; do not put it behind a NAT that
# rewrites the relay ports.

# --- listening ---------------------------------------------------------------
listening-port=3478
tls-listening-port=5349
# TURN over TLS on 443 gets through restrictive corporate firewalls. Requires
# a dedicated IP (or SNI routing) because 443 is usually taken by HTTPS.
# alt-tls-listening-port=443
min-port=49152
max-port=65535
# listening-ip=<private ip>
# external-ip=<public ip>/<private ip>
# relay-ip=<private ip>

# --- TLS ---------------------------------------------------------------------
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1
cipher-list="ECDHE+AESGCM:ECDHE+CHACHA20"


# --- authentication ----------------------------------------------------------
use-auth-secret
# static-auth-secret is passed via --static-auth-secret from a secret store.
# Must equal TURN_SECRET of apps/signaling. Rotate by deploying a new secret to
# both; existing credentials expire after TURN_CREDENTIAL_TTL_SECONDS.
realm=turn.example.com
fingerprint

# --- abuse protection --------------------------------------------------------
no-cli
no-multicast-peers
no-loopback-peers
stale-nonce=600
user-quota=12
total-quota=1200
max-bps=12500000
# Never relay into private, loopback or link-local networks (SSRF via TURN).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# --- logging -----------------------------------------------------------------
log-file=stdout
simple-log
# Do not enable 'verbose' in production: it logs per-allocation details.
