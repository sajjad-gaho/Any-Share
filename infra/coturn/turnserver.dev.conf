# coturn — LOCAL DEVELOPMENT configuration.
#
# Not for production: no TLS, relays to private addresses allowed (so two
# clients on the same machine / LAN can be tested), verbose logging.
# Production: turnserver.prod.conf.
#
# The shared secret is NOT in this file. docker-compose passes it on the
# command line from infra/coturn/.env (TURN_SECRET), which is git-ignored.

# --- listening ---------------------------------------------------------------
listening-port=3478
# Relay ports (UDP). Keep the range small for Docker port publishing.
min-port=49160
max-port=49200
# When running in Docker on a laptop, relayed addresses must be reachable from
# the host. docker-compose sets --external-ip (default 127.0.0.1); use your
# LAN IP instead to test from a second machine.

# --- authentication ----------------------------------------------------------
# TURN REST API / shared-secret mode: apps/signaling issues time-limited
# credentials (username "<expiry>:<user id>", password = HMAC-SHA1(secret)).
# No static users exist.
use-auth-secret
realm=kestrel.local
fingerprint

# --- hardening (also sensible in development) --------------------------------
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
stale-nonce=600
user-quota=12
total-quota=100
# Special-purpose ranges are never valid peers.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
# Development only: allow loopback and private ranges so local tests work.
allowed-peer-ip=127.0.0.1
allowed-peer-ip=10.0.0.0-10.255.255.255
allowed-peer-ip=172.16.0.0-172.31.255.255
allowed-peer-ip=192.168.0.0-192.168.255.255

# --- logging -----------------------------------------------------------------
log-file=stdout
simple-log
verbose
