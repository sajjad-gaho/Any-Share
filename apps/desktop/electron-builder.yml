# Packaging configuration. appId, productName and copyright are the public
# PBS AnyDesk identity; change them together with the AppUserModelId in
# src/main/main.ts and BRAND in packages/shared/src/brand.ts. Changing appId
# makes Windows treat the result as a different application (no in-place upgrade).
#
# User data stays in %APPDATA%\@remote-desktop\desktop (from package.json `name`,
# not productName), so renaming the product keeps sign-in and the device identity.
#
# Release builds: `pnpm --filter @remote-desktop/desktop package:win` with
# MAIN_VITE_API_URL (https://) and MAIN_VITE_SIGNALING_URL (wss://) set in
# apps/desktop/.env.production; scripts/after-pack.cjs refuses anything else.
appId: com.pbsdigitals.pbs-anydesk
productName: PBS AnyDesk
copyright: Copyright © 2026 PBS AnyDesk

directories:
  output: release
  buildResources: build

# Everything the app needs is bundled by electron-vite into out/.
files:
  - out/**/*
  - package.json
  - '!**/*.map'

asar: true

# Electron fuses (RunAsNode, NODE_OPTIONS, --inspect off; asar integrity and
# asar-only loading on; cookie encryption on). file:// keeps its default
# privileges until the renderer moves to a custom app:// protocol.
# Flipped and verified by scripts/after-pack.cjs in a child process, so they
# cannot be undone by switches or environment variables at run time.
afterPack: scripts/after-pack.cjs

# The Rust helper runs as a separate process, so it lives outside the asar
# archive. Build it first: pnpm --filter @remote-desktop/windows-helper build
extraResources:
  - from: ../../native/windows-helper/target/release/kestrel-helper.exe
    to: kestrel-helper.exe
electronLanguages:
  - en-US

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: pbs-anydesk-setup-${version}-${arch}.${ext}
  # Application icon: build/icon.png (512x512, the PBS AnyDesk mark). electron-builder
  # turns it into the multi-size .ico for the app, its shortcuts and the installer.
  #
  # CODE SIGNING: NOT CONFIGURED (no certificate available). Unsigned builds show
  # a SmartScreen warning and cannot be auto-updated safely. When a certificate
  # exists, enable ONE of these (docs/windows-release.md):
  #   a) Azure Trusted Signing / Artifact Signing (recommended, no HSM to manage):
  # azureSignOptions:
  #   publisherName: <exact certificate subject CN>
  #   endpoint: https://<region>.codesigning.azure.net
  #   certificateProfileName: <profile>
  #   codeSigningAccountName: <account>
  #   b) EV/OV certificate on a hardware token or cloud HSM via signtool:
  # signtoolOptions:
  #   publisherName: <exact certificate subject CN>
  #   certificateSubjectName: <subject>
  #   rfc3161TimeStampServer: http://timestamp.digicert.com
  # The private key must never be stored in this repository or in CI variables
  # as a plain file.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: PBS AnyDesk
